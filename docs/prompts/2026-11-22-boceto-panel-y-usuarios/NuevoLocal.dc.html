<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nuevo local</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lbl{font-size:13px;color:#6B7280}
.req{color:#991B1B}
.seg{display:flex;gap:4px}
.seg button{height:36px;padding:0 12px;border:1px solid #E5E7EB;border-radius:8px;background:#FFFFFF;font:inherit;font-size:14px;color:#1F2937;cursor:pointer}
.seg button.on{background:#EAF0FB;border-color:#4A6FB8;color:#2F4F8F;font-weight:500}
.btn{height:40px;padding:0 16px;border:1px solid #E5E7EB;border-radius:8px;background:#FFFFFF;font:inherit;font-size:14px;color:#1F2937;cursor:pointer}
.btnp{height:40px;padding:0 18px;border:0;border-radius:8px;background:#4A6FB8;font:inherit;font-size:14px;font-weight:500;color:#FFFFFF;cursor:pointer}
input{height:40px;border:1px solid #E5E7EB;border-radius:8px;padding:0 12px;font:inherit;font-size:14px;box-sizing:border-box;width:100%}
button:focus-visible,input:focus-visible{outline:2px solid #4A6FB8;outline-offset:2px}
</style>
</helmet>
<div style="width: 640px; height: 620px; background: #6B7280; display: flex; align-items: center; justify-content: center; font-family: Inter, system-ui, sans-serif; color: #1F2937;">
  <div role="dialog" aria-label="Nuevo local" style="width: 560px; background: #FFFFFF; border-radius: 10px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600;">Nuevo local</h1>
      <span class="lbl">después completás el resto en su ficha</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 14px; font-weight: 500;">Marca <span class="req">*</span></span>
      <div class="seg"><button class="on" aria-pressed="true">Ragú Bodegón</button><button aria-pressed="false">Trattoria Padella</button><button aria-pressed="false">Casa Nonnos</button></div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 14px; font-weight: 500;">Zona o ubicación <span class="req">*</span></span>
      <input value="Belgrano">
    </label>

    <div style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 14px; font-weight: 500;">Tipo</span>
      <div class="seg"><button class="on" aria-pressed="true">Restaurante</button><button aria-pressed="false">Cocina central</button><button aria-pressed="false">Producción</button></div>
    </div>

    <div style="background: #F7F8FA; border: 1px solid #E5E7EB; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px;">
      <span class="lbl" style="font-weight: 500;">Así va a quedar</span>
      <div style="display: flex; justify-content: space-between; font-size: 14px;"><span class="lbl">Nombre</span><span style="font-weight: 600;">Ragú Belgrano</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px;"><span class="lbl">Código</span><span style="font-weight: 600; font-variant-numeric: tabular-nums;">RAGU-002</span></div>
      <span class="lbl">El número sigue solo: es el segundo local de Ragú.</span>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 14px; font-weight: 500;">Motivo <span class="req">*</span></span>
      <input placeholder="Por ejemplo: apertura nueva en Belgrano">
    </label>

    <div style="display: flex; justify-content: flex-end; gap: 8px;">
      <button class="btn">Cancelar</button>
      <button class="btnp">Crear y completar la ficha</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":640,"height":620}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
