# Publica en el ambiente de prueba (staging), ADR-0018.
# Corre solo después de que "Pruebas" termina en verde sobre main, con el mismo commit que se probó,
# o a mano desde la pestaña Actions. Orden: base de datos → funciones → configuración de Auth → app.
# Si la base falla, la app no se publica: la app nunca queda adelantada a la base.
# Las claves viven en el ambiente "staging" de GitHub; nunca en el repositorio ni en Claude Code.
name: Publicar en staging

on:
  workflow_run:
    workflows: [Pruebas]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      load_demo_data:
        description: "Cargar las personas y datos de prueba (solo si la base está vacía)"
        type: boolean
        default: false

permissions:
  contents: read

# Una sola publicación a la vez, y nunca se corta una a la mitad.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publicar:
    name: Base, funciones y app de staging
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://grupo-lf-staging.vercel.app
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # El proyecto de los secretos tiene que ser el de [remotes.staging] en supabase/config.toml.
      # Así un secreto mal cargado nunca publica en otro proyecto (por ejemplo, producción).
      - name: Verificar que el destino es staging
        run: |
          expected=$(awk '/^\[remotes\.staging\]$/ {f=1; next} /^\[/ {f=0} f && /^project_id *=/ {gsub(/[" ]/, "", $0); split($0, a, "="); print a[2]}' supabase/config.toml)
          if [ -z "$expected" ] || [ "$STAGING_PROJECT_REF" != "$expected" ]; then
            echo "::error::STAGING_PROJECT_REF no coincide con [remotes.staging] de supabase/config.toml. No se publica."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Misma versión de la CLI de Supabase que package.json. Sin --include-seed: los datos de
      # prueba locales nunca llegan a staging (ADR-0005).
      - name: Conectar con el proyecto de staging
        run: npx supabase link --project-ref "$STAGING_PROJECT_REF"

      - name: Aplicar migraciones nuevas
        run: npx supabase db push --yes

      - name: Publicar Edge Functions
        run: npx supabase functions deploy auth-login invite-user

      - name: Subir la configuración de Auth y la API
        run: npx supabase config push --yes

      - name: Cargar personas y datos de prueba
        if: github.event_name == 'workflow_dispatch' && inputs.load_demo_data
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_DEMO_PASSWORD: ${{ secrets.STAGING_DEMO_PASSWORD }}
        run: psql -X --no-password "$STAGING_DB_URL" -v demo_password="$STAGING_DEMO_PASSWORD" -f supabase/staging/demo-data.sql

      # La app se arma con las variables públicas del proyecto de Vercel (URL y clave publishable
      # de staging). En Vercel no hay ninguna clave de servidor.
      - name: Publicar la app en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@58.4.4 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@58.4.4 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@58.4.4 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
