# Pruebas en cada pull request y en cada push a main (prompt maestro, secciones 8 y 9).
# Una tarea está terminada solo cuando todo esto pasa en verde.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Lint, tipos, Vitest, pgTAP y Playwright
    runs-on: ubuntu-latest
    # Playwright corre con un solo proceso (comparten la base) y ya pasa los 35 minutos.
    timeout-minutes: 90
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Una migración ya publicada en main nunca se modifica, se renombra ni se borra (database.md).
      - name: Migraciones de main sin cambios
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "origin/${{ github.base_ref }}"...HEAD -- supabase/migrations)
          if [ -n "$changed" ]; then
            echo "::error::Se modificaron migraciones existentes. Creá una migración nueva en su lugar:"
            echo "$changed"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas de lógica (Vitest)
        run: npm run test:unit

      # Supabase LOCAL dentro del runner, con la misma versión de CLI que package.json.
      # Nunca se conecta a staging ni a producción desde este job.
      # Las Edge Functions (edge-runtime) hacen falta para el ingreso (auth-login, ADR-0010).
      # Mailpit hace falta para la prueba de recuperar la contraseña (lee el correo con el enlace).
      # Storage (storage-api) hace falta para las fotos de las recetas (ADR-0023, PR 3).
      - name: Levantar Supabase local
        run: npx supabase start -x studio,imgproxy,realtime,postgres-meta,vector,logflare,supavisor

      # La app y Playwright usan los valores PÚBLICOS de desarrollo de .env.example (URL y clave
      # publishable local). Se verifica, sin mostrarla, que la clave coincida con la de esta Supabase
      # local. Ninguna clave de servidor sale de la CLI ni se guarda.
      - name: Variables públicas de desarrollo
        run: |
          grep -E '^NEXT_PUBLIC_[A-Z_]+=' .env.example >> "$GITHUB_ENV"
          expected=$(grep -E '^NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=' .env.example | cut -d= -f2-)
          actual=$(npx supabase status -o env | grep -E '^PUBLISHABLE_KEY=' | cut -d= -f2- | tr -d '"')
          if [ "$expected" != "$actual" ]; then
            echo "::error::La clave publishable de .env.example no coincide con la de Supabase local. Actualizala con la de npx supabase status."
            exit 1
          fi

      - name: Aplicar migraciones desde cero
        run: npx supabase db reset

      - name: Pruebas de base de datos (pgTAP)
        run: npm run test:db

      - name: Instalar navegador de Playwright
        # Sin --with-deps: la imagen de GitHub ya trae las librerías de Chromium y apt dependía de los espejos de
        # Ubuntu, que el 11/11/2026 dejaron de resolverse desde las máquinas de GitHub (solo faltaban fuentes que no usamos).
        run: npx playwright install chromium

      - name: Build
        run: npm run build

      # pgTAP deja la base como estaba (todo en transacciones con rollback): no hace falta recrearla.
      - name: Pruebas de flujos y accesibilidad (Playwright + axe)
        run: npm run test:e2e
        env:
          E2E_SKIP_RESET: "1"

      - name: Guardar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Apagar Supabase local
        if: always()
        run: npx supabase stop --no-backup
